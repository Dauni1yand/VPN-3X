services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Deliberately NOT published to the host: only the compose network
    # needs Postgres, and install.sh runs migrations inside a container.
    # Publishing it exposed the database to the internet on a box without
    # a firewall.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # Not published either -- same reason as Postgres above, and the queue
    # now carries node SSH credentials between the API and the worker.

  server:
    build: ./server
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./server
    env_file: .env
    command: ["arq", "app.workers.worker_settings.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - server

volumes:
  db-data:
