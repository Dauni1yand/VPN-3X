services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Deliberately NOT published to the host: only the compose network
    # needs Postgres, and install.sh runs migrations inside a container.
    # Publishing it exposed the database to the internet on a box without
    # a firewall.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # Not published either -- same reason as Postgres above, and the queue
    # now carries node SSH credentials between the API and the worker.

  server:
    build: ./server
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./server
    env_file: .env
    command: ["arq", "app.workers.worker_settings.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - server

  # --- Remnawave panel ------------------------------------------------------
  # Optional: `docker compose --profile remnawave up -d` runs the panel here,
  # alongside the main server. install.sh does this for you. Leave the profile
  # off and point REMNAWAVE_BASE_URL at a panel you already run instead --
  # nothing else in the stack cares which of the two it is.
  #
  # Wiring follows remnawave/backend's own docker-compose-prod.yml: the image
  # is pinned to the major, Valkey is reached over a unix socket in a shared
  # volume rather than TCP (the container runs with --port 0), and the panel's
  # health endpoint lives on the metrics port.
  #
  # These read .env.remnawave, NOT our .env. The panel has its own
  # TELEGRAM_BOT_TOKEN, and handing it our file would quietly give the panel
  # our bot's token. It also keeps the panel's database credentials separate
  # from ours, which is the point of it having its own database at all.
  remnawave-db:
    image: postgres:18.4
    hostname: remnawave-db
    profiles: ["remnawave"]
    shm_size: 512mb
    restart: always
    env_file: .env.remnawave
    environment:
      TZ: UTC   # the panel requires its database in UTC
    volumes:
      - remnawave-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 10s
      retries: 10

  remnawave-redis:
    image: valkey/valkey:9-alpine
    hostname: remnawave-redis
    profiles: ["remnawave"]
    restart: always
    volumes:
      - valkey-socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/var/run/valkey/valkey.sock", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  remnawave:
    image: remnawave/backend:3
    hostname: remnawave
    profiles: ["remnawave"]
    restart: always
    env_file: .env.remnawave
    volumes:
      - valkey-socket:/var/run/valkey
    # Published on loopback only: the panel's admin UI and API must not be
    # reachable from the internet on a bare port. Our own server reaches it
    # as http://remnawave:3000 over the compose network, which needs no
    # published port at all -- this is here so an admin can tunnel in with
    # `ssh -L 3000:127.0.0.1:3000`.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      remnawave-db:
        condition: service_healthy
      remnawave-redis:
        condition: service_healthy

volumes:
  db-data:
  remnawave-db-data:
  valkey-socket:
